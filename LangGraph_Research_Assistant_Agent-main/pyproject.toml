[project]
name = "langgraph-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "gradio>=6.30.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-cli[inemem,inmem]>=0.4.31",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"          # mặc định chạy OFFLINE (mock), không tốn API
markers = [
    "live: test gọi API thật DeepSeek + Tavily (bật bằng: uv run pytest -m live)",
]
